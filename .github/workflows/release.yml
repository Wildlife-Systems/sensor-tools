name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-24.04-arm
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential g++ libncurses-dev zlib1g-dev
    
    - name: Build release
      run: make release MARCH=armv8-a
    
    - name: Package
      run: |
        mkdir -p dist
        cp sensor-data dist/sensor-data-linux-arm64
        chmod +x dist/sensor-data-linux-arm64
        tar -czvf dist/sensor-data-linux-arm64.tar.gz -C dist sensor-data-linux-arm64
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: linux-arm64
        path: dist/sensor-data-linux-arm64.tar.gz

  build-deb:
    runs-on: ubuntu-24.04-arm
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper devscripts fakeroot libncurses-dev zlib1g-dev
    
    - name: Build Debian package
      run: |
        dpkg-buildpackage -us -uc -b
        mkdir -p dist
        cp ../sensor-tools_*.deb dist/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: debian-package
        path: dist/*.deb

  upload-release-assets:
    needs: [build-linux, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
    
    - name: Display structure
      run: ls -R artifacts
    
    - name: Upload release assets
      uses: softprops/action-gh-release@v3
      with:
        files: |
          artifacts/linux-arm64/sensor-data-linux-arm64.tar.gz
          artifacts/debian-package/*.deb
